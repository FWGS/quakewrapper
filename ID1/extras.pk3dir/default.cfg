//
// load keybindings
//
// commands with a leading + will also be called
// for key up events with the + changed to a -
//

unbindall

//
// character controls
//
bind	ALT			+strafe

bind	,			+moveleft
bind	.			+moveright
bind	PGUP			+lookup
bind	PGDN			+lookdown
bind	END			centerview
bind	a			+moveleft
bind	d			+moveright
bind	v			+moveup
bind	c			+movedown
bind	"'"			+moveup
bind	"/"			+movedown
bind	SHIFT			+speed
bind	CTRL			+movedown

bind	UPARROW		+forward
bind	w			+forward

bind	DOWNARROW		+back
bind	s			+back

bind	LEFTARROW		+left
bind	RIGHTARROW		+right

//
// objects, weapons
//

// weapon selection, Half-Life style aliases over Quake impulses
alias	slot1			"impulse 1"
alias	slot2			"impulse 2"
alias	slot3			"impulse 3"
alias	slot4			"impulse 4"
alias	slot5			"impulse 5"
alias	slot6			"impulse 6"
alias	slot7			"impulse 7"
alias	slot8			"impulse 8"
alias	invnext			"impulse 10"
alias	invprev			"impulse 12"

bind	1 			slot1
bind	2 			slot2
bind	3 			slot3
bind	4 			slot4
bind	5 			slot5
bind	6 			slot6
bind	7 			slot7
bind	8 			slot8

bind	q			invprev
bind	e			invnext
bind	[			invprev
bind	]			invnext

bind	SPACE			+jump
bind	ENTER			+attack

bind	TAB		+showscores

//
// mouse buttons
//

bind	MOUSE1		+attack
bind	MOUSE2		+jump
bind	MWHEELDOWN 		invnext
bind	MWHEELUP 		invprev

// Function keys
bind   F5         "snapshot"
bind	F6			"echo Quicksaving...; wait; save quick"
bind	F7			"echo Quickloading...; wait; load quick"
bind	F10			"quit"

//
// client environment commands
//
bind	PAUSE				"pause"
bind 	ESCAPE 			"cancelselect"
bind	~				"toggleconsole"
bind	`				"toggleconsole"

bind	t				"messagemode"

bind	+				"sizeup"
bind	=				"sizeup"
bind	-				"sizedown"

bind	INS				+klook


//
// default cvars
//

viewsize		100
volume 			0.7
sensitivity		3
cl_forwardspeed		400
cl_backspeed		400
cl_sidespeed		400
+mlook
_windowed_mouse		1
